# ============================================================
# Container tmux configuration
# ============================================================
#
# Quick reference (Ctrl+B is the prefix key):
#
#   SPLITTING
#     Ctrl+B |         split vertical
#     Ctrl+B -         split horizontal
#
#   SWITCHING PANES
#     Ctrl+B arrow     switch pane (universal)
#     Alt+arrow        switch pane (Linux, no prefix)
#     Opt+Shift+arrow  switch pane (Mac, no prefix)
#
#   RESIZING PANES
#     Ctrl+B Ctrl+arrow   resize by 2 cells (repeatable)
#
#   SESSIONS
#     Ctrl+B d         detach from session
#     tmux attach      reattach to last session
#
#   OTHER
#     Ctrl+B r         reload this config
#     exit / Ctrl+D    close current pane
# ============================================================

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pane navigation — no prefix key needed
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left select-pane -L
bind -n M-S-Right select-pane -R
bind -n M-S-Up select-pane -U
bind -n M-S-Down select-pane -D

# Fix for podman-on-macOS halving terminal width
setw -g aggressive-resize on

# Pane resizing
bind -r C-Left resize-pane -L 2
bind -r C-Right resize-pane -R 2
bind -r C-Up resize-pane -U 2
bind -r C-Down resize-pane -D 2

# Mouse support
set -g mouse on

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Windows and indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar
set -g status-style 'bg=colour235 fg=colour248'
set -g status-left '#[fg=colour214,bold] #S #[fg=colour248]│ '
set -g status-left-length 20
set -g status-right '#[fg=colour248]#{pane_current_path}'
set -g status-right-length 60

setw -g window-status-current-style 'fg=colour214 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'fg=colour248'
setw -g window-status-format ' #I:#W '

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour214'
